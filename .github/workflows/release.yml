name: Release Charts

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare environment
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          mkdir -p ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      
      - name: Cache binaries
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/gomplate
            ~/.local/bin/helm-docs
            ~/.local/bin/helm
            ~/.local/bin/helm-unittest
            ~/.local/bin/yq
          key: ${{ runner.os }}-tools-202604

      - name: Install binaries
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"
          curl -sSfL https://get.helm.sh/helm-v3.18.3-linux-amd64.tar.gz -o helm.tar.gz
          tar -xzf helm.tar.gz
          mv linux-amd64/helm ~/.local/bin/helm
          curl -sSfL https://github.com/hairyhenderson/gomplate/releases/download/v5.0.0/gomplate_linux-amd64 -o ~/.local/bin/gomplate
          curl -sSfL https://github.com/norwoodj/helm-docs/releases/download/v1.14.2/helm-docs_1.14.2_Linux_x86_64.tar.gz -o helm-docs.tar.gz
          curl -sSfL https://github.com/helm-unittest/helm-unittest/releases/download/v0.8.2/helm-unittest-linux-amd64-0.8.2.tgz -o helm-unittest.tgz
          curl -sSfL https://github.com/mikefarah/yq/releases/download/v4.45.4/yq_linux_amd64 -o ~/.local/bin/yq
          tar -xzf helm-docs.tar.gz helm-docs
          tar -xzf helm-unittest.tgz untt
          mv helm-docs ~/.local/bin/helm-docs
          mv untt ~/.local/bin/helm-unittest
          chmod +x ~/.local/bin/helm ~/.local/bin/gomplate ~/.local/bin/helm-docs ~/.local/bin/helm-unittest ~/.local/bin/yq
          cd -
          rm -rf "$TEMP_DIR"
          helm version --short

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y gettext-base jq gnupg

      - name: Configure Environment
        run: |
          REPO_OWNER="${GITHUB_REPOSITORY_OWNER:-${GITHUB_REPOSITORY%%/*}}"
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          echo "REPO_OWNER=$REPO_OWNER" >> "$GITHUB_ENV"
          echo "REPO_URL=https://${REPO_OWNER}.${{ vars.GIT_PAGES_DOMAIN }}/${REPO_NAME}" >> $GITHUB_ENV
          echo "GITHUB_REPO_URL=${{ vars.GIT_BASE_URL }}/${GITHUB_REPOSITORY}" >> $GITHUB_ENV

      - name: Prepare Index Data
        run: |
          # Generate charts JSON safely using standard yq-to-json and robust jq mapping
          shopt -s nullglob
          rm -f /tmp/charts-list.jsonl
          for f in charts/*/Chart.yaml; do
            yq -o=json '.' "$f" | jq -c '{name: .name, description: .description, version: .version, appVersion: (.appVersion // "")}' >> /tmp/charts-list.jsonl
          done
          jq -s '{charts: .}' /tmp/charts-list.jsonl > /tmp/charts-data.json
          shopt -u nullglob

          cp index.html.gotmpl /tmp/index.html.gotmpl

      - name: Prepare Dynamic READMEs for Release
        env:
          REPO_URL: ${{ env.REPO_URL }}
        run: |
          # Overwrite READMEs with platform-specific URLs purely for packaging (.tgz)
          shopt -s nullglob
          for tmpl in charts/*/README.md.gotmpl; do
            dir=$(dirname "$tmpl")
            REPO_URL="${REPO_URL}" envsubst '${REPO_URL}' < "$tmpl" > "${dir}/README.md.gotmpl.tmp"
            REPO_URL="${REPO_URL}" helm-docs \
              --chart-search-root="${dir}" \
              --template-files="$(realpath "${dir}/README.md.gotmpl.tmp")" \
              --output-file="README.md" \
              --ignore-non-descriptions \
              --log-level=warn
            rm -f "${dir}/README.md.gotmpl.tmp"
          done
          shopt -u nullglob

      - name: Validate charts
        run: |
          for chart in affine n8n; do
            helm_values_args=()
            unittest_values_args=()

            if [[ "$chart" == "affine" ]]; then
              values_file="/tmp/${chart}-validation-values.yaml"
              printf 'app:\n  externalUrl: https://affine.example.com\n' > "$values_file"
              helm_values_args=(-f "$values_file")
              unittest_values_args=(-v "$values_file")
            fi

            helm lint "charts/$chart" --strict "${helm_values_args[@]}"
            helm-unittest -f 'unittests/*_test.yaml' --strict "${unittest_values_args[@]}" "charts/$chart"
            helm template "$chart" "charts/$chart" "${helm_values_args[@]}" --debug > "/tmp/${chart}-rendered.yaml"
          done

      - name: Import Helm signing key
        env:
          HELM_GPG_PRIVATE_KEY: ${{ secrets.HELM_GPG_PRIVATE_KEY }}
          HELM_GPG_PASSPHRASE: ${{ secrets.HELM_GPG_PASSPHRASE }}
          HELM_GPG_KEY_UID: ${{ secrets.HELM_GPG_KEY_UID }}
        run: |
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -p "$GNUPGHOME" "${RUNNER_TEMP}/helm-gpg"
          chmod 700 "$GNUPGHOME"

          if [[ "$HELM_GPG_PRIVATE_KEY" == *"BEGIN PGP PRIVATE KEY BLOCK"* ]]; then
            printf '%s' "$HELM_GPG_PRIVATE_KEY" > "${RUNNER_TEMP}/helm-gpg/private.key"
          else
            printf '%s' "$HELM_GPG_PRIVATE_KEY" | base64 -d > "${RUNNER_TEMP}/helm-gpg/private.key"
          fi

          gpg --batch --pinentry-mode loopback --passphrase "$HELM_GPG_PASSPHRASE" --import "${RUNNER_TEMP}/helm-gpg/private.key"
          printf '%s' "$HELM_GPG_PASSPHRASE" > "${RUNNER_TEMP}/helm-gpg/passphrase"
          chmod 600 "${RUNNER_TEMP}/helm-gpg/passphrase"
          gpg --batch --pinentry-mode loopback --passphrase "$HELM_GPG_PASSPHRASE" --output "${RUNNER_TEMP}/helm-gpg/secring.gpg" --export-secret-keys "$HELM_GPG_KEY_UID"

          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "HELM_GPG_KEYRING=${RUNNER_TEMP}/helm-gpg/secring.gpg" >> "$GITHUB_ENV"
          echo "HELM_GPG_PASSPHRASE_FILE=${RUNNER_TEMP}/helm-gpg/passphrase" >> "$GITHUB_ENV"

      - name: Prepare cr config
        env:
          HELM_GPG_KEY_UID: ${{ secrets.HELM_GPG_KEY_UID }}
        run: |
          cat > .cr.yaml <<EOF
          owner: ${{ env.REPO_OWNER }}
          git-repo: helm-charts
          git-base-url: ${{ vars.GIT_API_BASE_URL }}
          git-upload-url: ${{ vars.GIT_UPLOAD_URL }}
          charts_repo_url: ${{ env.REPO_URL }}
          package-path: .cr-release-packages
          sign: true
          key: ${HELM_GPG_KEY_UID}
          keyring: ${{ env.HELM_GPG_KEYRING }}
          passphrase-file: ${{ env.HELM_GPG_PASSPHRASE_FILE }}
          EOF


      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          config: .cr.yaml
          pages_branch: pages
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Update index.html on pages branch
        env:
          REPO_URL: ${{ env.REPO_URL }}
          GITHUB_REPO_URL: ${{ env.GITHUB_REPO_URL }}
        run: |
          git reset --hard HEAD
          git clean -fd
          git fetch origin pages
          git checkout -B pages origin/pages

          if [[ -f index.yaml ]]; then
            # We construct a simpler yq script file on the fly to avoid inline curly brace parsing explosion
            echo '.entries | to_entries | map({
              "name": .key,
              "description": .value[0].description,
              "version": .value[0].version,
              "appVersion": (.value[0].appVersion // "")
            })' > /tmp/yq_script.jq
            charts_json=$(yq '.' -o json index.yaml | jq -f /tmp/yq_script.jq | jq '{"charts": .}')
          else
            charts_json=$(cat /tmp/charts-data.json)
          fi
          echo "$charts_json" > /tmp/charts-data-pages.json

          gomplate -f /tmp/index.html.gotmpl -o index.html -d charts=file:///tmp/charts-data-pages.json

          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "docs: update index.html"
            git pull origin pages --rebase || true
            git push origin pages
          fi

      - name: Delete old workflow runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          API_URL="${GITHUB_API_URL}"
          REPO="${GITHUB_REPOSITORY}"
          echo "Fetching runs for workflow: $WORKFLOW_NAME on $API_URL"
          
          # Fetch recent 100 runs
          RUNS_JSON=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" "${API_URL}/repos/${REPO}/actions/runs?per_page=100")
          
          ERROR_MSG=$(echo "$RUNS_JSON" | jq -r '.message // empty')
          if [ -n "$ERROR_MSG" ]; then
            echo "API returned error: $ERROR_MSG"
            # Prevent failing the whole build just because of cleanup
            exit 0
          fi

          # Extract all runs for current workflow, sort by creation (newest first), keep the first 15, and get the rest IDs
          RUN_IDS=$(echo "$RUNS_JSON" | jq -r --arg wf "$WORKFLOW_NAME" '.workflow_runs | map(select(.name == $wf)) | sort_by(.created_at) | reverse | .[15:] | .[].id')
          
          if [ -z "$RUN_IDS" ] || [ "$RUN_IDS" = "null" ]; then
            echo "No old runs to delete."
            exit 0
          fi
          
          for RUN_ID in $RUN_IDS; do
            echo "Deleting run: $RUN_ID"
            curl -s -X DELETE -H "Authorization: token ${GITHUB_TOKEN}" "${API_URL}/repos/${REPO}/actions/runs/${RUN_ID}" || true
          done
