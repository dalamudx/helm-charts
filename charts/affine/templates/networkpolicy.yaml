{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "front.fullname" . }}
  labels:
    {{- include "front.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "front.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
{{- if .Values.networkPolicy.allowExternalFrontIngress }}
        - {}
{{- else }}
        - podSelector: {}
{{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.front.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "graphql.fullname" . }}
  labels:
    {{- include "graphql.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "graphql.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "front.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.graphql.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "doc.fullname" . }}
  labels:
    {{- include "doc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "doc.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "front.selectorLabels" . | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "graphql.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.doc.service.port }}
{{- end }}
