{{- if and .Values.smtp.enabled (not .Values.smtp.existingSecret) (or .Values.smtp.username.value .Values.smtp.password.value) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vaultwarden.smtp.secretName" . }}
  labels:
    app.kubernetes.io/component: vaultwarden
{{ include "vaultwarden.labels" . | nindent 4 }}
type: Opaque
data:
  {{- with .Values.smtp.username.value }}
  {{ $.Values.smtp.username.existingSecretKey }}: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.smtp.password.value }}
  {{ $.Values.smtp.password.existingSecretKey }}: {{ . | b64enc | quote }}
  {{- end }}
{{ end }}
{{- if and (not .Values.config.disableAdminToken) .Values.adminToken }}
{{- if not .Values.adminToken.existingSecret }}
{{- $secretName := include "vaultwarden.adminToken.secretName" . -}}
{{- $secretKey := default "ADMIN_TOKEN" .Values.adminToken.existingSecretKey -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/component: vaultwarden
{{ include "vaultwarden.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $existingSecret (hasKey $existingSecret.data $secretKey) }}
  {{ $secretKey }}: {{ index $existingSecret.data $secretKey }}
  {{- else if .Values.adminToken.value }}
  {{ $secretKey }}: {{ .Values.adminToken.value | b64enc | quote }}
  {{- else }}
  {{ $secretKey }}: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
{{ end }}
{{ end }}
