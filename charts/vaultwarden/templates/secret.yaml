{{- $databaseType := lower .Values.database.type -}}
{{- if and (ne $databaseType "sqlite") (not .Values.database.external.existingSecret) (or .Values.database.external.connectionString.value .Values.database.external.username.value .Values.database.external.password.value) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vaultwarden.database.secretName" . }}
  labels:
    app.kubernetes.io/component: vaultwarden
{{ include "vaultwarden.labels" . | nindent 4 }}
type: Opaque
data:
  {{- with .Values.database.external.connectionString.value }}
  {{ $.Values.database.external.connectionString.existingSecretKey }}: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.database.external.username.value }}
  {{ $.Values.database.external.username.existingSecretKey }}: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.database.external.password.value }}
  {{ $.Values.database.external.password.existingSecretKey }}: {{ . | b64enc | quote }}
  {{- end }}
{{ end }}
{{- if and (not .Values.security.hibp.existingSecret) .Values.security.hibp.apiKey.value }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vaultwarden.hibp.secretName" . }}
  labels:
    app.kubernetes.io/component: vaultwarden
{{ include "vaultwarden.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.security.hibp.apiKey.existingSecretKey }}: {{ .Values.security.hibp.apiKey.value | b64enc | quote }}
{{ end }}
