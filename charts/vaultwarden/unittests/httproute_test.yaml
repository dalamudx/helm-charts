suite: test vaultwarden httproute

templates:
  - templates/httproute.yaml

release:
  name: vaultwarden
  namespace: vaultwarden

chart:
  version: 1.0.0
  appVersion: 1.0.0

tests:
  - it: should not create httproute when httpRoute.enabled is false
    set:
      httpRoute:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should create httproute with parentRefs and hostnames
    set:
      httpRoute:
        enabled: true
        parentRefs:
          - name: edge
        hostnames:
          - vault.example.com
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: HTTPRoute
      - equal:
          path: spec.parentRefs[0].name
          value: edge
      - equal:
          path: spec.hostnames[0]
          value: vault.example.com

  - it: should set annotations and labels when configured
    set:
      httpRoute:
        enabled: true
        annotations:
          test-annotation: enabled
        labels:
          test-label: enabled
        parentRefs:
          - name: edge
        hostnames:
          - vault.example.com
    asserts:
      - equal:
          path: metadata.annotations.test-annotation
          value: enabled
      - equal:
          path: metadata.labels.test-label
          value: enabled

  - it: should route slash prefix to the vaultwarden service port
    set:
      service:
        port: 8080
      httpRoute:
        enabled: true
        parentRefs:
          - name: edge
        hostnames:
          - vault.example.com
    asserts:
      - contains:
          path: spec.rules
          content:
            matches:
              - path: { type: PathPrefix, value: / }
            backendRefs:
              - name: vaultwarden
                port: 8080
          any: true
