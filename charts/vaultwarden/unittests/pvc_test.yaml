suite: test vaultwarden pvc

templates:
  - templates/pvc.yaml

release:
  name: vaultwarden
  namespace: vaultwarden

chart:
  version: 1.0.0
  appVersion: 1.0.0

tests:
  - it: should not create pvc when storage.enabled is false
    set:
      storage:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create pvc when existingClaim is set
    set:
      storage:
        enabled: true
        existingClaim: existing-vaultwarden-pvc
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create standalone pvc for StatefulSet workload
    set:
      workload:
        kind: StatefulSet
      storage:
        enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should create pvc for Deployment workload with storage enabled
    set:
      workload:
        kind: Deployment
      storage:
        enabled: true
        storageClassName: fast-ssd
        size: 20Gi
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: vaultwarden
      - equal:
          path: spec.storageClassName
          value: fast-ssd
      - equal:
          path: spec.resources.requests.storage
          value: 20Gi
